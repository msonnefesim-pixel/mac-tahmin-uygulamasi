name: Android ikon PNG hazirlama
on:
  push:
    branches: [main]
    paths:
      - 'icon.svg'
      - '.github/workflows/icon-png.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SVG ikonlarini PNG yap
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url='icon.svg', write_to=f'icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: PNG dosyalarini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Android uyumlu uygulama ikonlarini ekle"
            git push
          fi
