name: JavaScript syntax check
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/js-syntax-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check inline scripts
        run: |
          python - <<'PY'
          import re
          s = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for i, script in enumerate(scripts, 1):
              open(f"/tmp/script-{i}.js", "w", encoding="utf-8").write(script)
          print(f"Extracted {len(scripts)} scripts")
          PY
          for f in /tmp/script-*.js; do echo "Checking $f"; node --check "$f"; done
