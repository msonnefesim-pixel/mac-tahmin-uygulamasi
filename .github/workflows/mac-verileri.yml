
name: Mac Verilerini Getir

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  maclari-getir:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Acik futbol verilerini indir
        run: |
          set -e
          git clone --depth 1 https://github.com/oladeeayo/open-matchday.git upstream

      - name: Mac ve gecmis verilerini hazirla
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          root = Path("upstream/data")
          league_names = {}

          with open("upstream/LEAGUE_INDEX.md", encoding="utf-8") as f:
              for line in f:
                  parts = [x.strip() for x in line.split("|")]
                  if len(parts) >= 3:
                      folder = parts[1].strip("`")
                      name = parts[2]
                      if folder and name and folder != "Folder":
                          league_names[folder] = name

          now = datetime.now(ZoneInfo("Europe/Istanbul"))
          today = now.date()
          end_date = today + timedelta(days=7)

          fixtures = []
          history = []

          for file in root.glob("*/fixtures_2627.csv"):
              league_id = file.parent.name
              league = league_names.get(league_id, league_id)

              with open(file, encoding="utf-8-sig", newline="") as f:
                  for row in csv.DictReader(f):
                      try:
                          raw_time = (row.get("time") or "").strip()
                          base_date = datetime.strptime(
                              row["date"], "%Y-%m-%d"
                          ).date()

                          if raw_time:
                              kickoff = datetime.strptime(
                                  row["date"] + " " + raw_time,
                                  "%Y-%m-%d %H:%M"
                              ) + timedelta(hours=2)

                              match_date = kickoff.date()
                              match_time = kickoff.strftime("%H:%M")
                          else:
                              match_date = base_date
                              match_time = "Saat açıklanmadı"

                          if today <= match_date <= end_date:
                              fixtures.append({
                                  "league_id": league_id,
                                  "league": league,
                                  "date": match_date.strftime("%Y-%m-%d"),
                                  "time": match_time,
                                  "home": row["home"],
                                  "away": row["away"]
                              })

                      except (ValueError, KeyError):
                          continue

          for file in root.glob("*/results_2627.csv"):
              league_id = file.parent.name
              league = league_names.get(league_id, league_id)

              with open(file, encoding="utf-8-sig", newline="") as f:
                  for row in csv.DictReader(f):
                      try:
                          if not row.get("ft_home") or not row.get("ft_away"):
                              continue

                          history.append({
                              "league_id": league_id,
                              "league": league,
                              "date": row["date"],
                              "home": row["home"],
                              "away": row["away"],
                              "ft_home": int(row["ft_home"]),
                              "ft_away": int(row["ft_away"]),
                              "ht_home": int(row["ht_home"]) if row.get("ht_home", "").strip() else None,
                              "ht_away": int(row["ht_away"]) if row.get("ht_away", "").strip() else None
                          })

                      except (ValueError, KeyError):
                          continue

          fixtures.sort(key=lambda x: (x["date"], x["time"]))
          history.sort(key=lambda x: x["date"])

          if not history:
              raise SystemExit("HATA: Gecmis mac verisi bulunamadi.")

          data = {
              "source": "open-matchday",
              "updated": now.isoformat(),
              "fixtures": fixtures,
              "history": history
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)

          print("Lig sayisi:", len(set(x["league_id"] for x in fixtures)))
          print("Gelecek mac sayisi:", len(fixtures))
          print("Gecmis mac sayisi:", len(history))
          print("Veri dosyasi hazirlandi.")
          PY

      - name: Verileri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          if git diff --cached --quiet; then
            echo "Mac verisinde degisiklik yok."
            exit 0
          fi
          git commit -m "Mac saatleri duzeltildi"
          # Canli skor gorevi de main'e yazarken cakisma olursa yeniden taban al.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase cakismasi; otomatik veri ezilmesi engellendi."
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Mac verileri yayinlandi."
              exit 0
            fi
            echo "Eszamanli commit algilandi; tekrar deneme: $attempt"
            sleep 2
          done
          echo "Bes denemede mac verileri push edilemedi."
          exit 1
