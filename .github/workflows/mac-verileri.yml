
name: Mac Verilerini Getir

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  maclari-getir:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Gunluk maclari getir
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          TARIH=$(TZ=Europe/Istanbul date +%F)

          curl -fsS -G \
            "https://v3.football.api-sports.io/fixtures" \
            -H "x-apisports-key: $API_KEY" \
            --data-urlencode "date=$TARIH" \
            --data-urlencode "timezone=Europe/Istanbul" \
            -o data.json

          jq -e '.response != null' data.json >/dev/null

      - name: Tek takim gecmis testi
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e

          test -n "$API_KEY"

          echo "524 numarali takim test ediliyor"

          curl -sS -G \
            "https://v3.football.api-sports.io/fixtures" \
            -H "x-apisports-key: $API_KEY" \
            --data-urlencode "team=524" \
            --data-urlencode "last=10" \
            --data-urlencode "timezone=Europe/Istanbul" \
            -o team_history.json

          echo "API TEST SONUCU:"

          jq '{
            get: .get,
            errors: .errors,
            results: .results,
            response_count: ((.response // []) | length),
            first_match: (.response[0] // null)
          }' team_history.json

          jq '{
            team_id: 524,
            get: .get,
            errors: .errors,
            results: .results,
            response: (.response // [])
          }' team_history.json > history.json

      - name: Verileri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json history.json

          git diff --cached --quiet || (
            git commit -m "Tek takim gecmis testi"
            git push
          )
