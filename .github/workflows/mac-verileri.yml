
name: Mac Verilerini Getir

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  maclari-getir:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Gunluk maclari getir
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          TARIH=$(TZ=Europe/Istanbul date +%F)

          curl -fsS -G \
            "https://v3.football.api-sports.io/fixtures" \
            -H "x-apisports-key: $API_KEY" \
            --data-urlencode "date=$TARIH" \
            --data-urlencode "timezone=Europe/Istanbul" \
            -o data.json

          jq -e '.response != null' data.json >/dev/null

      - name: Takimlarin son maclarini getir
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          echo '{"teams":{}}' > history.json

          TEAM_IDS=$(jq -r \
            '.response[]? | .teams.home.id, .teams.away.id' \
            data.json | sort -nu | head -n 40)

          for TEAM_ID in $TEAM_IDS; do
            echo "Takim gecmisi aliniyor: $TEAM_ID"

            curl -fsS -G \
              "https://v3.football.api-sports.io/fixtures" \
              -H "x-apisports-key: $API_KEY" \
              --data-urlencode "team=$TEAM_ID" \
              --data-urlencode "last=10" \
              --data-urlencode "timezone=Europe/Istanbul" \
              -o team_history.json

            jq -e '.response != null' team_history.json >/dev/null

            jq --arg id "$TEAM_ID" \
              --slurpfile gecmis team_history.json \
              '.teams[$id] = $gecmis[0].response' \
              history.json > history_temp.json

            mv history_temp.json history.json
            sleep 6.5
          done

      - name: Verileri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json history.json
          git diff --cached --quiet || (
            git commit -m "Gunluk mac ve takim gecmisleri"
            git push
          )
