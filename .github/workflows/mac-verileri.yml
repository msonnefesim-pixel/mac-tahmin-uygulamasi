
name: Mac Verilerini Getir

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  maclari-getir:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Gunluk maclari getir
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          TARIH=$(TZ=Europe/Istanbul date +%F)

          curl -fsS -G \
            "https://v3.football.api-sports.io/fixtures" \
            -H "x-apisports-key: $API_KEY" \
            --data-urlencode "date=$TARIH" \
            --data-urlencode "timezone=Europe/Istanbul" \
            -o data.json

          jq -e '.response != null' data.json >/dev/null

      - name: Tarih araligiyla takim gecmisi
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e

          BUGUN=$(TZ=Europe/Istanbul date +%F)
          BASLANGIC=$(TZ=Europe/Istanbul date -d "$BUGUN -60 days" +%F)

          echo "Takim: 524"
          echo "Sezon: 2026"
          echo "Baslangic: $BASLANGIC"
          echo "Bitis: $BUGUN"

          curl -sS -G \
            "https://v3.football.api-sports.io/fixtures" \
            -H "x-apisports-key: $API_KEY" \
            --data-urlencode "team=524" \
            --data-urlencode "season=2026" \
            --data-urlencode "from=$BASLANGIC" \
            --data-urlencode "to=$BUGUN" \
            --data-urlencode "timezone=Europe/Istanbul" \
            -o team_history.json

          echo "API TEST SONUCU:"

          jq '{
            get: .get,
            errors: .errors,
            results: .results,
            response_count: ((.response // []) | length),
            first_match: (.response[0] // null)
          }' team_history.json

          jq '{
            teams: {
              "524": (.response // [])
            }
          }' team_history.json > history.json

      - name: Verileri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json history.json

          git diff --cached --quiet || (
            git commit -m "Takim gecmis verileri"
            git push
          )
