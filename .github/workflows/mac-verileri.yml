
name: Mac Verilerini Getir

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  maclari-getir:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Mac verilerini API'den al
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          TARIH=$(TZ=Europe/Istanbul date +%F)

          curl -fsS -G \
            "https://v3.football.api-sports.io/fixtures" \
            -H "x-apisports-key: $API_KEY" \
            --data-urlencode "date=$TARIH" \
            --data-urlencode "timezone=Europe/Istanbul" \
            -o data.json

          jq -e '.response != null' data.json >/dev/null

      - name: Verileri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (
            git commit -m "Gunluk mac verileri"
            git push
          )
