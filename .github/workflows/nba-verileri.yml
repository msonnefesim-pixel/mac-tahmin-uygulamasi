
name: NBA Verilerini Getir

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  nba-verilerini-getir:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Python ortamını hazırla
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: NBA verisini indir ve kontrol et
        run: |
          python - <<'PY'
          import pandas as pd
          import requests

          url = "https://github.com/WalrusQuant/sportsleader-data/releases/download/nba_games/2027.parquet"

          print("NBA verisi indiriliyor...")
          response = requests.get(url, timeout=120)
          response.raise_for_status()

          with open("nba_test.parquet", "wb") as f:
              f.write(response.content)

          df = pd.read_parquet("nba_test.parquet")

          print("Toplam kayıt:", len(df))
          print("Sütunlar:", list(df.columns))
          print("İlk 5 kayıt:")
          print(df.head().to_string())

          if df.empty:
              raise SystemExit("NBA verisi boş!")

          print("NBA VERİSİ BAŞARIYLA İNDİRİLDİ!")
          PY

      - name: NBA veri dosyasını hazırla
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          data = {
              "source": "WalrusQuant",
              "updated": datetime.now(timezone.utc).isoformat(),
              "games": []
          }

          with open("nba.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("nba.json hazırlandı.")
          PY

      - name: Değişiklikleri kaydet
        run: |
          rm -f nba_test.parquet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba.json
          git diff --cached --quiet || git commit -m "NBA veri dosyasını güncelle"
          git push
