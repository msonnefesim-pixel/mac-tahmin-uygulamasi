
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YaPaYCiN Maç Analiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eef2ff;font-family:Arial;padding:15px}
h1{font-size:25px;color:#55d6a0}
h2{font-size:19px;color:#55d6a0;margin-top:24px}
p{color:#aab7cc;font-size:13px}
.panel,.match{background:#1b293d;border:1px solid #30435d;border-radius:12px;padding:13px;margin:10px 0}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px}
input,select{background:#101827;color:white;border:1px solid #40536d}
button{background:#55d6a0;color:#10251d;border:0;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 4px;text-align:center;border-bottom:1px solid #34445a}
th{color:#55d6a0}
.good{color:#55d6a0;font-weight:bold}
.small{font-size:12px;color:#aab7cc}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{background:#263b54;padding:7px;border-radius:7px;font-size:12px}
</style>
</head>
<body>

<h1>YaPaYCiN Maç Analiz</h1>
<p>Bağımsız maç tahmin ve analiz sistemi</p>

<div class="panel">
 <div id="durum">Veriler yükleniyor...</div>
 <div id="sayilar"></div>
 <button onclick="baslat()">Verileri Yenile</button>
</div>

<h2>Geçmiş Başarı Analizi</h2>
<div class="panel" id="birlesik"></div>

<h2>İlk Yarı KG Eşik Testi</h2>
<div class="panel" id="ilkTablo"></div>

<h2>İkinci Yarı KG Eşik Testi</h2>
<div class="panel" id="ikinciTablo"></div>

<h2>Maçları İncele</h2>
<div class="panel">
 <input id="arama" placeholder="Takım veya lig ara..." oninput="listele()">
 <select id="filtre" onchange="listele()">
  <option value="all">Bütün maçlar</option>
  <option value="strong">Öne çıkanlar</option>
  <option value="six">6+ Gol (bağımsız)</option>
  <option value="btts">KG Var (bağımsız)</option>
  <option value="first">İlk Yarı KG</option>
  <option value="second">İkinci Yarı KG</option>
 </select>
 <p class="small">6+ Gol ve KG Var filtreleri birbirinden bağımsızdır. Birinin gerçekleşmesi için diğerinin gerçekleşmesi gerekmez.</p>
 <div id="maclar"></div>
</div>

<script>
let FIXTURES=[],HISTORY=[];

function ort(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function factorial(n){let x=1;for(let i=2;i<=n;i++)x*=i;return x}
function poisson(k,l){return Math.exp(-l)*Math.pow(l,k)/factorial(k)}
function skorVar(v){return v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v))}
function yuzde(v){return v===null||v===undefined?"-":(v*100).toFixed(1)+"%"}
function basari(a,b){return a?Math.round(b/a*100)+"%":"-"}

function golOlasilik(a,b){
 let p=0;
 for(let i=0;i<9;i++)for(let j=0;j<9;j++)
  if(i+j>=6)p+=poisson(i,a)*poisson(j,b);
 return Math.min(1,p);
}
function kgOlasilik(a,b){
 return (1-Math.exp(-a))*(1-Math.exp(-b));
}

function takimMaclari(lig,takim,tarih){
 return HISTORY.filter(m=>
  String(m.league_id)===String(lig)&&
  String(m.date)<String(tarih)&&
  (m.home===takim||m.away===takim)&&
  skorVar(m.ft_home)&&skorVar(m.ft_away)
 ).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10);
}

function yariMaclari(ms){
 return ms.filter(m=>
  skorVar(m.ht_home)&&skorVar(m.ht_away)&&
  Number(m.ft_home)>=Number(m.ht_home)&&
  Number(m.ft_away)>=Number(m.ht_away)
 );
}

function golOrt(ms,takim,attigi,alan){
 return ort(ms.map(m=>{
  const ev=m.home===takim;
  let kendi=ev?Number(m.ft_home):Number(m.ft_away);
  let rakip=ev?Number(m.ft_away):Number(m.ft_home);

  if(alan==="ilk"){
   kendi=ev?Number(m.ht_home):Number(m.ht_away);
   rakip=ev?Number(m.ht_away):Number(m.ht_home);
  }
  if(alan==="ikinci"){
   kendi=ev?Number(m.ft_home)-Number(m.ht_home):Number(m.ft_away)-Number(m.ht_away);
   rakip=ev?Number(m.ft_away)-Number(m.ht_away):Number(m.ft_home)-Number(m.ht_home);
  }
  return attigi?kendi:rakip;
 }));
}

function yariTahmin(ev,dep,mac,alan){
 const e=yariMaclari(takimMaclari(mac.league_id,ev,mac.date));
 const d=yariMaclari(takimMaclari(mac.league_id,dep,mac.date));
 if(e.length<5||d.length<5)return null;

 const lig=HISTORY.filter(m=>
  String(m.league_id)===String(mac.league_id)&&
  String(m.date)<String(mac.date)&&
  skorVar(m.ht_home)&&skorVar(m.ht_away)&&
  skorVar(m.ft_home)&&skorVar(m.ft_away)
 );
 if(lig.length<10)return null;

 let toplam=0;
 lig.forEach(m=>{
  toplam+=alan==="ilk"?
   Number(m.ht_home)+Number(m.ht_away):
   Number(m.ft_home)-Number(m.ht_home)+Number(m.ft_away)-Number(m.ht_away);
 });
 const ligOrt=toplam/(lig.length*2);
 if(ligOrt<=0)return null;

 const lh=golOrt(e,ev,true,alan)*golOrt(d,dep,false,alan)/ligOrt;
 const la=golOrt(d,dep,true,alan)*golOrt(e,ev,false,alan)/ligOrt;
 return {kg:kgOlasilik(lh,la),lh,la};
}

function tahmin(m){
 const e=takimMaclari(m.league_id,m.home,m.date);
 const d=takimMaclari(m.league_id,m.away,m.date);
 if(e.length<5||d.length<5)return null;

 const lig=HISTORY.filter(x=>
  String(x.league_id)===String(m.league_id)&&
  String(x.date)<String(m.date)&&
  skorVar(x.ft_home)&&skorVar(x.ft_away)
 );
 if(lig.length<10)return null;

 const ligOrt=lig.reduce((s,x)=>
  s+Number(x.ft_home)+Number(x.ft_away),0)/(lig.length*2);
 if(ligOrt<=0)return null;

 const lh=golOrt(e,m.home,true,"tam")*golOrt(d,m.away,false,"tam")/ligOrt;
 const la=golOrt(d,m.away,true,"tam")*golOrt(e,m.home,false,"tam")/ligOrt;

 let uc=0;
 for(let i=0;i<=3;i++)
  for(let j=0;j<=3-i;j++)
   uc+=poisson(i,lh)*poisson(j,la);

 return {
  six:golOlasilik(lh,la),
  three:1-uc,
  btts:kgOlasilik(lh,la),
  ilk:yariTahmin(m.home,m.away,m,"ilk"),
  ikinci:yariTahmin(m.home,m.away,m,"ikinci")
 };
}

function sonucIlk(m){
 return Number(m.ht_home)>0&&Number(m.ht_away)>0;
}
function sonucIkinci(m){
 return Number(m.ft_home)-Number(m.ht_home)>0&&
 Number(m.ft_away)-Number(m.ht_away)>0;
}
function sonucAlti(m){
 return Number(m.ft_home)+Number(m.ft_away)>=6;
}
function sonucKG(m){
 return Number(m.ft_home)>0&&Number(m.ft_away)>0;
}

function esikTablosu(veri){
 let h="<table><tr><th>Eşik</th><th>Aday</th><th>Başarılı</th><th>Oran</th></tr>";
 [40,50,60,70].forEach(esik=>{
  const a=veri.filter(x=>x.p>=esik/100);
  const b=a.filter(x=>x.ok).length;
  h+=`<tr><td>%${esik}</td><td>${a.length}</td><td>${b}</td><td>${basari(a.length,b)}</td></tr>`;
 });
 return h+"</table><p class='small'>Geçmiş maç sonuçlarıdır. Az adaylı eşiklerde belirsizlik yüksektir.</p>";
}

function testleriHesapla(){
 const kombinasyon=[
  {ad:"6+ gol + İlk yarı KG",aday:0,basarili:0},
  {ad:"6+ gol + İkinci yarı KG",aday:0,basarili:0},
  {ad:"6+ gol + İki yarıda da KG",aday:0,basarili:0}
 ];
 const ilk=[],ikinci=[];

 HISTORY.forEach(m=>{
  if(!skorVar(m.ft_home)||!skorVar(m.ft_away)||
     !skorVar(m.ht_home)||!skorVar(m.ht_away))return;

  const t=tahmin(m);
  if(!t)return;

  const a=t.six>=.20;
  const i=t.ilk&&t.ilk.kg>=.30;
  const s=t.ikinci&&t.ikinci.kg>=.50;
  const ga=sonucAlti(m),gi=sonucIlk(m),gs=sonucIkinci(m);

  if(a&&i){kombinasyon[0].aday++;if(ga&&gi)kombinasyon[0].basarili++}
  if(a&&s){kombinasyon[1].aday++;if(ga&&gs)kombinasyon[1].basarili++}
  if(a&&i&&s){kombinasyon[2].aday++;if(ga&&gi&&gs)kombinasyon[2].basarili++}

  if(t.ilk)ilk.push({p:t.ilk.kg,ok:gi});
  if(t.ikinci)ikinci.push({p:t.ikinci.kg,ok:gs});
 });

 let h="<table><tr><th>Kombinasyon</th><th>Aday</th><th>Tutan</th><th>Başarı</th></tr>";
 kombinasyon.forEach(x=>{
  h+=`<tr><td>${x.ad}</td><td>${x.aday}</td><td>${x.basarili}</td><td>${basari(x.aday,x.basarili)}</td></tr>`;
 });
 document.getElementById("birlesik").innerHTML=
 h+"</table><p class='small'>Bu tablo yalnızca birleşik geçmiş analiz içindir. Ana maç filtreleri bağımsızdır.</p>";

 document.getElementById("ilkTablo").innerHTML=esikTablosu(ilk);
 document.getElementById("ikinciTablo").innerHTML=esikTablosu(ikinci);
}

function macKart(m,t){
 return `<div class="match">
 <strong>${m.home} - ${m.away}</strong>
 <div class="small">${m.league||""} · ${m.date||""} ${m.time||""}</div>
 <div class="pills">
 <span class="pill">6+ Gol: ${yuzde(t.six)}</span>
 <span class="pill">KG Var: ${yuzde(t.btts)}</span>
 <span class="pill">3.5+ Gol: ${yuzde(t.three)}</span>
 <span class="pill">İlk Yarı KG: ${yuzde(t.ilk?.kg)}</span>
 <span class="pill">İkinci Yarı KG: ${yuzde(t.ikinci?.kg)}</span>
 </div></div>`;
}

function listele(){
 const arama=(document.getElementById("arama").value||"").toLocaleLowerCase("tr");
 const filtre=document.getElementById("filtre").value;

 let liste=FIXTURES.filter(m=>{
  const t=tahmin(m);
  if(!t)return false;

  const metin=(m.home+" "+m.away+" "+(m.league||"")).toLocaleLowerCase("tr");
  if(arama&&!metin.includes(arama))return false;

  if(filtre==="strong"&&!(
   t.six>=.20||t.btts>=.50||t.ilk?.kg>=.40||t.ikinci?.kg>=.50
  ))return false;

  if(filtre==="six"&&t.six<.20)return false;
  if(filtre==="btts"&&t.btts<.50)return false;
  if(filtre==="first"&&(!t.ilk||t.ilk.kg<.40))return false;
  if(filtre==="second"&&(!t.ikinci||t.ikinci.kg<.50))return false;

  return true;
 });

 liste.sort((a,b)=>(tahmin(b)?.six||0)-(tahmin(a)?.six||0));

 document.getElementById("maclar").innerHTML=liste.length?
  liste.map(m=>macKart(m,tahmin(m))).join(""):
  "Bu filtrede uygun maç bulunamadı.";
}

async function baslat(){
 document.getElementById("durum").innerText="Veriler yükleniyor...";
 try{
  const r=await fetch("./data.json?v="+Date.now());
  if(!r.ok)throw new Error("Veri dosyası yüklenemedi");
  const data=await r.json();

  FIXTURES=data.fixtures||[];
  HISTORY=data.history||[];

  document.getElementById("durum").innerHTML=
   "<span class='good'>Veriler başarıyla yüklendi</span>";

  document.getElementById("sayilar").innerHTML=
   `<p>Gelecek maç: ${FIXTURES.length} · Geçmiş maç: ${HISTORY.length}<br>Son güncelleme: ${data.updated||"-"}</p>`;

  testleriHesapla();
  listele();
 }catch(e){
  document.getElementById("durum").innerText="Hata: "+e.message;
 }
}

baslat();
</script>
</body>
</html>
