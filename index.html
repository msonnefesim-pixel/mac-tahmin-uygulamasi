
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YaPaYCiN Maç Analiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#101827;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:15px 5px}
h1{color:#39e58c;font-size:25px}
.sub,.muted{color:#aab7c8;font-size:12px}
.info,.panel{background:#1d2b40;padding:14px;border-radius:13px;margin:13px 0}
h2{font-size:18px;color:#39e58c}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat,.cell{background:#26374e;border-radius:10px;padding:12px;text-align:center}
.stat span,.cell span{display:block;color:#aab7c8;font-size:11px;margin-bottom:6px}
.stat strong,.cell b{font-size:17px;color:#ffd166}
input,select{width:100%;padding:12px;margin:5px 0;background:#26374e;color:white;border:1px solid #52647c;border-radius:9px}
.card{background:#1c2b40;border:1px solid #34445b;border-radius:14px;padding:14px;margin:12px 0}
.good{border:1px solid #39e58c}
.league{font-size:12px;color:#39e58c;margin-bottom:10px}
.teams{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:14px}
.team{width:43%;text-align:center}
.vs{color:#9baac0}
.time{text-align:center;color:#cbd5e1;font-size:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.badge{text-align:center;color:#39e58c;font-size:11px;margin-top:10px}
.empty{text-align:center;color:#aab7c8;padding:22px}
</style>
</head>
<body>

<header>
<h1>⚽ YaPaYCiN Maç Analiz</h1>
<div class="sub">Gol tahminleri • Geçmiş başarı testi</div>
</header>

<div class="info" id="info">Veriler yükleniyor...</div>

<div class="panel">
<h2>📊 Geçmiş Tahmin Başarı Testi</h2>
<div class="stats">
<div class="stat"><span>6+ GOL BAŞARISI</span><strong id="test6">-</strong></div>
<div class="stat"><span>3.5 ÜST BAŞARISI</span><strong id="test3">-</strong></div>
<div class="stat"><span>6+ TEST MAÇI</span><strong id="count6">-</strong></div>
<div class="stat"><span>3.5 ÜST TEST MAÇI</span><strong id="count3">-</strong></div>
</div>
<p class="muted" id="testnote">Test hazırlanıyor...</p>
</div>

<div class="panel">
<h2>🔎 Maçları Bul</h2>
<input id="search" placeholder="Takım veya lig ara...">
<select id="filter">
<option value="all">Bütün maçlar</option>
<option value="strong">Güçlü gol adayları</option>
<option value="six">6+ gol adayları</option>
<option value="three">3.5 üst adayları</option>
</select>
</div>

<h2>⚽ Gelecek Maçlar</h2>
<div id="matches"><div class="empty">Maçlar yükleniyor...</div></div>

<script>
let FIXTURES=[];
let HISTORY=[];

function ort(a){
 return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
}
function factorial(n){
 let x=1;
 for(let i=2;i<=n;i++)x*=i;
 return x;
}
function poisson(lambda,k){
 return Math.exp(-lambda)*Math.pow(lambda,k)/factorial(k);
}
function golOlasilik(lh,la,min){
 let toplam=0;
 for(let h=0;h<=15;h++){
  for(let a=0;a<=15;a++){
   if(h+a>=min)toplam+=poisson(lh,h)*poisson(la,a);
  }
 }
 return Math.min(1,toplam);
}
function takimMaclari(lig,takim,tarih){
 return HISTORY.filter(m=>
  String(m.league_id)===String(lig)&&
  m.date<tarih&&
  (m.home===takim||m.away===takim)&&
  Number.isFinite(Number(m.ft_home))&&
  Number.isFinite(Number(m.ft_away))
 ).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
}
function takimGolOrt(maclar,takim,attigi){
 return ort(maclar.map(m=>{
  let ev=m.home===takim;
  return Number(attigi?(ev?m.ft_home:m.ft_away):(ev?m.ft_away:m.ft_home));
 }));
}
function tahmin(mac){
 let ev=takimMaclari(mac.league_id,mac.home,mac.date);
 let dep=takimMaclari(mac.league_id,mac.away,mac.date);
 if(ev.length<5||dep.length<5)return null;

 let lh=Math.max(.15,(takimGolOrt(ev,mac.home,true)+takimGolOrt(dep,mac.away,false))/2);
 let la=Math.max(.15,(takimGolOrt(dep,mac.away,true)+takimGolOrt(ev,mac.home,false))/2);

 return {
  three:golOlasilik(lh,la,4),
  six:golOlasilik(lh,la,6),
  btts:(1-Math.exp(-lh))*(1-Math.exp(-la)),
  lh,la,evN:ev.length,depN:dep.length
 };
}
function yuzde(x){return Math.round(x*100)+"%";}

function basariTesti(){
 let aday6=[],aday3=[];
 let gecmis=HISTORY.filter(m=>
  Number.isFinite(Number(m.ft_home))&&
  Number.isFinite(Number(m.ft_away))
 ).sort((a,b)=>a.date.localeCompare(b.date));

 gecmis.forEach(m=>{
  let t=tahmin(m);
  if(!t)return;
  let gol=Number(m.ft_home)+Number(m.ft_away);
  if(t.six>=.20)aday6.push(gol>=6);
  if(t.three>=.50)aday3.push(gol>=4);
 });

 let oran6=aday6.length?aday6.filter(Boolean).length/aday6.length:null;
 let oran3=aday3.length?aday3.filter(Boolean).length/aday3.length:null;

 document.getElementById("test6").textContent=oran6===null?"Veri yok":yuzde(oran6);
 document.getElementById("test3").textContent=oran3===null?"Veri yok":yuzde(oran3);
 document.getElementById("count6").textContent=aday6.length;
 document.getElementById("count3").textContent=aday3.length;

 document.getElementById("testnote").textContent=
 "6+ aday eşiği %20, 3.5 üst aday eşiği %50. Yalnızca maç tarihinden önceki sonuçlar kullanılır. Sonuçlar geçmiş test performansıdır, garanti değildir.";
}
function macKart(m){
 let t=tahmin(m);
 let guclu=t&&(t.six>=.20||t.three>=.50);
 return `
 <div class="card ${guclu?"good":""}">
 <div class="league">${m.league||"Lig bilgisi yok"}</div>
 <div class="teams">
 <div class="team">${m.home}</div><div class="vs">VS</div>
 <div class="team">${m.away}</div>
 </div>
 <div class="time">📅 ${m.date||""} • 🕒 ${m.time||"--:--"}</div>
 ${t?`
 <div class="grid">
 <div class="cell"><span>3.5 ÜST</span><b>${yuzde(t.three)}</b></div>
 <div class="cell"><span>6+ GOL</span><b>${yuzde(t.six)}</b></div>
 <div class="cell"><span>MAÇ KG</span><b>${yuzde(t.btts)}</b></div>
 <div class="cell"><span>BEKLENEN GOL</span><b>${(t.lh+t.la).toFixed(2)}</b></div>
 <div class="cell"><span>EV SAHİBİ GOL</span><b>${t.lh.toFixed(2)}</b></div>
 <div class="cell"><span>DEPLASMAN GOL</span><b>${t.la.toFixed(2)}</b></div>
 </div>
 <div class="badge">${guclu?"⭐ GOL ADAYI":"Normal analiz"} • Geçmiş maç: ${t.evN}+${t.depN}</div>
 `:`<div class="empty">Yeterli geçmiş veri yok. Tahmin üretilmedi.</div>`}
 </div>`;
}
function listele(){
 let arama=document.getElementById("search").value.toLocaleLowerCase("tr");
 let filtre=document.getElementById("filter").value;
 let sonuc=FIXTURES.filter(m=>{
  let t=tahmin(m);
  let metin=(m.home+" "+m.away+" "+m.league).toLocaleLowerCase("tr");
  if(arama&&!metin.includes(arama))return false;
  if(filtre==="strong"&&!(t&&(t.six>=.20||t.three>=.50)))return false;
  if(filtre==="six"&&!(t&&t.six>=.20))return false;
  if(filtre==="three"&&!(t&&t.three>=.50))return false;
  return true;
 });
 document.getElementById("matches").innerHTML=sonuc.length?
  sonuc.map(macKart).join(""):'<div class="empty">Bu filtrede maç bulunamadı.</div>';
}
async function baslat(){
 try{
  let cevap=await fetch("./data.json?v="+Date.now());
  if(!cevap.ok)throw new Error("data.json bulunamadı");
  let data=await cevap.json();
  FIXTURES=data.fixtures||[];
  HISTORY=data.history||[];

  document.getElementById("info").textContent=
   "Kaynak: "+(data.source||"Bilinmiyor")+
   " • Gelecek maç: "+FIXTURES.length+
   " • Geçmiş maç: "+HISTORY.length+
   " • Güncelleme: "+(data.updated||"-");

  basariTesti();
  listele();
 }catch(e){
  document.getElementById("info").textContent="Veri yüklenemedi: "+e.message;
 }
}
document.getElementById("search").addEventListener("input",listele);
document.getElementById("filter").addEventListener("change",listele);
baslat();
</script>
</body>
</html>
